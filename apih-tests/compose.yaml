name: magento2-integration

services:
  integration-db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: magento_integration
      MARIADB_USER: magento_integration
      MARIADB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?Run apih-tests/setup.sh}
      MARIADB_ROOT_PASSWORD: ${INTEGRATION_DB_ROOT_PASSWORD:?Run apih-tests/setup.sh}
    volumes:
      - integration-db-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30

  integration-search:
    image: opensearchproject/opensearch:3.1.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - integration-search-data:/usr/share/opensearch/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  integration-php:
    build: ../docker/local
    user: "${INTEGRATION_UID:?}:${INTEGRATION_GID:?}"
    working_dir: /var/www/html
    environment:
      INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?}
    volumes:
      - ..:/var/www/html:ro,z
      - ../var/apih-integration/etc:/var/www/html/app/etc:z
      - ../var/apih-integration/var:/var/www/html/var:z
      - ../var/sample-data:/var/www/html/var/sample-data:ro,z
      - ../var/apih-integration/generated:/var/www/html/generated:z
      - ../var/apih-integration/static:/var/www/html/pub/static:z
      - ../var/apih-integration/media:/var/www/html/pub/media:z
    depends_on:
      integration-db:
        condition: service_healthy
      integration-search:
        condition: service_healthy

  integration-web:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ..:/var/www/html:ro,z
      - ../var/apih-integration/var:/var/www/html/var:ro,z
      - ../var/apih-integration/static:/var/www/html/pub/static:ro,z
      - ../var/apih-integration/media:/var/www/html/pub/media:ro,z
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - integration-php

volumes:
  integration-db-data:
  integration-search-data:
