name: magento2-local

services:
  php:
    build: docker/local
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /var/www/html
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro,z
      - ./docker/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - php
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: magento
      MARIADB_USER: magento
      MARIADB_PASSWORD: ${MAGENTO_DB_PASSWORD:?Set MAGENTO_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MAGENTO_DB_ROOT_PASSWORD:?Set MAGENTO_DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.1.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - search-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
  search-data:
